[manifest]
minimum_effigy_version = "0.7.0"

[catalog]
alias = "acme-client"

[package_manager]
js = "bun"

[task_defaults]
run_in = "host"

[test.suites.vitest]
run = "bun run test"

[tasks]
build = "cd {repo} && bun run tsc -p tsconfig.json"
check = "cd {repo} && bun run check"

qa = [{ task = "validate" }]
health = [{ task = "check" }]
validate = [
  { task = "check" },
  { task = "build" }
]
