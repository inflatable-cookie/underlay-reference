[manifest]
minimum_effigy_version = "0.11.0"

[catalog]
alias = "acme-api"

[task_defaults]
run_in = "host"

[test.suites]
rust = "oxide test --workspace"

[tasks]
api = "cd {repo} && oxide run -p acme-api {args}"
jobs = "cd {repo} && oxide run -p acme-jobs {args}"
build = "cd {repo} && oxide build {args}"
"test:db" = { run = "cd {repo} && if [ \"$EFFIGY_PROFILE_DATABASE\" != \"acme\" ] || [ -z \"${EFFIGY_PROFILE_FRONT_DECLARED#test.}\" ] || [ \"${EFFIGY_PROFILE_FRONT_DECLARED#test.}\" = \"$EFFIGY_PROFILE_FRONT_DECLARED\" ]; then echo 'run DB tests through effigy dev:test disposable profile'; exit 2; fi && oxide test --workspace -- --include-ignored --test-threads=1", run_in = "host" }

check = "cd {repo} && oxide check --workspace --all-features {args}"

# Dev database tools run on the host against the running hybrid profile
# (`effigy dev`); the bundle's hybrid:exec executes its command on the host and
# supplies its DATABASE_URL, so the Rust call goes through Oxide like every
# other host Rust route.
"migration:reset:schema" = { run = "effigy --repo {repo}/../.. hybrid:exec -- oxide run --manifest-path {repo}/Cargo.toml -p acme-db --bin reset_dev_db {args}", run_in = "host" }
"migration:apply" = { run = "effigy --repo {repo}/../.. hybrid:exec -- oxide run --manifest-path {repo}/Cargo.toml -p acme-db --bin migrate_dev_db -- schema {args}", run_in = "host" }
"migration:apply:overlay" = { run = "effigy --repo {repo}/../.. hybrid:exec -- oxide run --manifest-path {repo}/Cargo.toml -p acme-db --bin migrate_dev_db -- overlay {args}", run_in = "host" }
"migration:reset" = [
  { task = "migration:reset:schema" },
  { task = "migration:apply" },
  { task = "migration:apply:overlay" }
]

clippy = "cd {repo} && oxide clippy --workspace --all-targets -- -D warnings"
fmt = "cd {repo} && oxide fmt --all --check"

# Cheap orientation for `effigy doctor`. Full build stays in validate.
health = [{ task = "fmt" }, { task = "check" }]
validate = [
  { task = "build" },
  { task = "test" },
  { task = "clippy" },
  { task = "fmt" }
]
qa = [{ task = "validate" }]
