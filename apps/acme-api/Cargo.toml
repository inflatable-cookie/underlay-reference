[workspace]
resolver = "2"
members = [
  "crates/core",
  "crates/infra",
  "crates/db",
  "crates/auth",
  "crates/domain",
  "crates/api",
  "crates/jobs",
  "crates/test-utils",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
dotenvy = "0.15"
rand = "0.10.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower-http = { version = "0.6", features = ["trace", "cors", "request-id", "propagate-header"] }
uuid = { version = "1", features = ["v7", "serde"] }

# Database (optional for now)
sqlx = { version = "0.9", default-features = true, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "migrate", "chrono", "json", "macros"] }

# Image processing
image = "0.25"

# File type detection by magic bytes

# Underlay crates (released tag v0.9.7)
underlay-core = { git = "ssh://git@github.com/inflatable-cookie/underlay.git", tag = "v0.9.7" }
underlay-http = { git = "ssh://git@github.com/inflatable-cookie/underlay.git", tag = "v0.9.7", features = ["error-logging"] }
underlay-query = { git = "ssh://git@github.com/inflatable-cookie/underlay.git", tag = "v0.9.7" }
