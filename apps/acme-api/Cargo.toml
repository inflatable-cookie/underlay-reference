[workspace]
resolver = "2"
members = [
  "crates/core",
  "crates/infra",
  "crates/db",
  "crates/auth",
  "crates/domain",
  "crates/api",
  "crates/jobs",
  "crates/test-utils",
]

[workspace.package]
version = "0.1.0"
rust-version = "1.100.0"
edition = "2021"

[workspace.lints.clippy]
# underlay-http's ApiError is the canonical handler error and is returned
# unboxed by design (see the allow note in routes/admin/users.rs). Boxing it
# would force map_err at every `?` site, so this lint would fire on nearly
# every handler result.
result_large_err = "allow"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
dotenvy = "0.15"
rand = "0.10.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower-http = { version = "0.6", features = ["trace", "cors", "request-id", "propagate-header"] }
uuid = { version = "1", features = ["v7", "serde"] }

# Database (optional for now)
sqlx = { version = "0.9", default-features = true, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "migrate", "chrono", "json", "macros"] }

# Nightfire rich-text and block model (released tag v0.6.0; replaces the
# retired underlay-nightfire facade). Uses the same HTTPS source URL as
# Underlay's own workspace so Cargo unifies it with the copy underlay-media
# pulls in through its `nightfire` feature. An ssh:// URL here builds two
# distinct `nightfire` crates and fails type-checking.
nightfire = { git = "https://github.com/inflatable-cookie/nightfire.git", tag = "v0.6.0" }

# Image processing
image = "0.25"

# File type detection by magic bytes

# Underlay crates (released tag v0.11.0)
underlay-core = { git = "ssh://git@github.com/inflatable-cookie/underlay.git", tag = "v0.11.0" }
underlay-http = { git = "ssh://git@github.com/inflatable-cookie/underlay.git", tag = "v0.11.0", features = ["error-logging"] }
underlay-query = { git = "ssh://git@github.com/inflatable-cookie/underlay.git", tag = "v0.11.0" }
underlay-observability = { git = "ssh://git@github.com/inflatable-cookie/underlay.git", tag = "v0.11.0" }
underlay-auth = { git = "ssh://git@github.com/inflatable-cookie/underlay.git", tag = "v0.11.0" }
underlay-auth-session = { git = "ssh://git@github.com/inflatable-cookie/underlay.git", tag = "v0.11.0" }
underlay-auth-state-postgres = { git = "ssh://git@github.com/inflatable-cookie/underlay.git", tag = "v0.11.0" }
underlay-blob = { git = "ssh://git@github.com/inflatable-cookie/underlay.git", tag = "v0.11.0", features = ["s3"] }
underlay-auth-email-totp = { git = "ssh://git@github.com/inflatable-cookie/underlay.git", tag = "v0.11.0" }
underlay-auth-jwt = { git = "ssh://git@github.com/inflatable-cookie/underlay.git", tag = "v0.11.0" }
underlay-auth-oauth = { git = "ssh://git@github.com/inflatable-cookie/underlay.git", tag = "v0.11.0" }
underlay-auth-password = { git = "ssh://git@github.com/inflatable-cookie/underlay.git", tag = "v0.11.0" }
underlay-auth-totp = { git = "ssh://git@github.com/inflatable-cookie/underlay.git", tag = "v0.11.0" }
underlay-auth-webauthn = { git = "ssh://git@github.com/inflatable-cookie/underlay.git", tag = "v0.11.0" }
underlay-audit = { git = "ssh://git@github.com/inflatable-cookie/underlay.git", tag = "v0.11.0" }
underlay-config = { git = "ssh://git@github.com/inflatable-cookie/underlay.git", tag = "v0.11.0" }
underlay-db = { git = "ssh://git@github.com/inflatable-cookie/underlay.git", tag = "v0.11.0" }
underlay-devtools = { git = "ssh://git@github.com/inflatable-cookie/underlay.git", tag = "v0.11.0" }
underlay-email = { git = "ssh://git@github.com/inflatable-cookie/underlay.git", tag = "v0.11.0", features = ["templates"] }
underlay-events = { git = "ssh://git@github.com/inflatable-cookie/underlay.git", tag = "v0.11.0" }
underlay-jobs = { git = "ssh://git@github.com/inflatable-cookie/underlay.git", tag = "v0.11.0" }
underlay-jobs-postgres = { git = "ssh://git@github.com/inflatable-cookie/underlay.git", tag = "v0.11.0" }
underlay-media = { git = "ssh://git@github.com/inflatable-cookie/underlay.git", tag = "v0.11.0", features = ["object-keys", "renditions"] }
underlay-ratelimit = { git = "ssh://git@github.com/inflatable-cookie/underlay.git", tag = "v0.11.0" }
underlay-security-alerts = { git = "ssh://git@github.com/inflatable-cookie/underlay.git", tag = "v0.11.0" }
underlay-testing = { git = "ssh://git@github.com/inflatable-cookie/underlay.git", tag = "v0.11.0" }
