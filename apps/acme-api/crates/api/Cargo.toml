[package]
name = "acme-api"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
chrono = { workspace = true }
dotenvy = { workspace = true }
rand = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
underlay-auth-jwt = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
underlay-auth = { workspace = true }
underlay-blob = { workspace = true }
underlay-core = { workspace = true }
underlay-db = { workspace = true }
underlay-email = { workspace = true, features = ["templates"] }
underlay-http = { workspace = true }
underlay-jobs = { workspace = true }
underlay-jobs-postgres = { workspace = true }
underlay-media = { workspace = true }
underlay-nightfire = { workspace = true }
underlay-observability = { workspace = true }
tower-http = { workspace = true }

acme-core = { path = "../core" }
acme-infra = { path = "../infra" }
acme-db = { path = "../db" }
acme-auth = { path = "../auth" }
acme-domain = { path = "../domain" }

# Auth dependencies
validator = { version = "0.20", features = ["derive"] }
utoipa = { version = "5.5", features = ["chrono", "uuid"] }
utoipa-swagger-ui = { version = "9", features = ["axum"] }
webauthn-rs-proto = "0.5.4"
once_cell = "1"
sha2 = "0.10"
hex = "0.4"
uuid = { workspace = true }

[dev-dependencies]
acme-test-utils = { path = "../test-utils" }
# LocalAdapter (dev-only seam) for exercising the validated upload helpers.
underlay-blob = { workspace = true, features = ["local"] }
underlay-testing = { workspace = true, features = ["server"] }
axum-test = "20"
tower = "0.5"
http-body-util = "0.1"
sqlx = { workspace = true }
