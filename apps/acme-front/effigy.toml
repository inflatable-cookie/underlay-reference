[manifest]
minimum_effigy_version = "0.7.0"

[catalog]
alias = "acme-front"

[package_manager]
js = "bun"

[task_defaults]
run_in = "host"

[tasks]
dev = [
  { task = "config:generate" },
  { task = "clean" },
  { task = "sync" },
  "cd {repo} && bun x vite dev --host 0.0.0.0 --force"
]
build = [
  { task = "config:generate" },
  "cd {repo} && bun x vite build"
]
preview = "cd {repo} && bun x vite preview"

clean = "cd {repo} && rm -rf .svelte-kit node_modules/.vite"
sync = "cd {repo} && bun x svelte-kit sync"
"config:generate" = "cd {repo} && bun scripts/generate-public-config.ts"
prepare = [
  { task = "config:generate" },
  "cd {repo} && bun x svelte-kit sync || echo ''"
]

health = [{ task = "check" }]
validate = [
  { task = "check" },
  { task = "build" }
]
qa = [{ task = "validate" }]

check = [
  { task = "config:generate" },
  { task = "sync" },
  "cd {repo} && bun x svelte-check --tsconfig ./tsconfig.json"
]
"check:watch" = [
  { task = "sync" },
  "cd {repo} && bun x svelte-check --tsconfig ./tsconfig.json --watch"
]
