[catalog]
alias = "acme-docs"

[docs_policy.indexes.vision]
file = "acme-docs/vision/README.md"
dir = "acme-docs/vision"
section = "Vision Artifacts"

[docs_policy.next_actions.vision]
index = "vision"
heading = "## Next Task"
allowlist_file = "acme-docs/policy/vision-next-task-verbs.txt"

[tasks]
health = [
  { task = "check:admin-freshness-rollout" },
]

validate = [
  { task = "check:admin-freshness-rollout" },
  { task = "check:auth-security-alerting-rollout" },
  { task = "check:reorder-conflict-rollout" },
]

"qa:docs:links" = "effigy docs check-links acme-docs/README.md acme-docs/vision/README.md acme-docs/roadmaps/README.md acme-docs/logs/README.md"
"qa:docs:agent-defaults" = "effigy docs check-forbidden AGENTS.md README.md --forbid '--repo .'"
"qa:docs:headings" = "effigy docs check-headings acme-docs/README.md acme-docs/vision/README.md acme-docs/roadmaps/README.md acme-docs/logs/README.md --require-heading '## Next Task'"
"qa:northstar:vision" = "effigy docs check-headings acme-docs/vision/README.md --require-heading '## Vision Artifacts' --require-heading '## Next Task'"
"qa:northstar:roadmaps" = "effigy docs check-headings acme-docs/roadmaps/README.md --require-heading '## Rules' --require-heading '## Current generation' --require-heading '## Next Task'"
"qa:northstar:g01" = "effigy docs check-headings acme-docs/roadmaps/g01/README.md --require-heading '## Sequence' --require-heading '## Next roadmap' --require-heading '## Next Task'"
"qa:northstar" = [
  { task = "qa:northstar:vision" },
  { task = "qa:northstar:roadmaps" },
  { task = "qa:northstar:g01" },
]
"qa:docs" = [
  { task = "qa:docs:links" },
  { task = "qa:docs:agent-defaults" },
  { task = "qa:northstar" },
]

qa = [
  { task = "validate" },
  { task = "qa:docs" },
]

"check:admin-freshness-rollout" = "bash ../scripts/check-admin-freshness-rollout.sh {args}"
"check:auth-security-alerting-rollout" = "bash ../scripts/check-auth-security-alerting-rollout.sh {args}"
"check:reorder-conflict-rollout" = "bash ../scripts/check-reorder-conflict-rollout.sh {args}"
