[manifest]
minimum_effigy_version = "0.7.0"

[catalog]
alias = "acme-docs"

[docs_policy.indexes.vision]
file = "vision/README.md"
dir = "vision"
section = "Vision Artifacts"

[docs_policy.next_actions.vision]
index = "vision"
heading = "## Next Task"
allowlist_file = "policy/vision-next-task-verbs.txt"

[tasks]
health = [
  { task = "check:rollout admin-freshness" },
]

validate = [
  { task = "check:rollout admin-freshness" },
  { task = "check:rollout auth-security-alerting" },
  { task = "check:rollout reorder-conflict" },
]

qa = [
  { task = "validate" },
  { task = "qa:docs" },
]

"qa:docs" = [
  { task = "docs check-links README.md vision/README.md roadmaps/README.md logs/README.md" },
  { task = "docs check-forbidden AGENTS.md README.md --forbid '--repo .'" },
  { task = "docs check-forbidden AGENTS.md README.md ../package.json --forbid '--repo .'" },
  { task = "qa:northstar" },
]

"qa:northstar" = [
  { task = "docs check-headings vision/README.md --require-heading '## Vision Artifacts' --require-heading '## Next Task'" },
  { task = "docs check-headings roadmaps/README.md --require-heading '## Rules' --require-heading '## Current generation' --require-heading '## Next Task'" },
  { task = "docs check-headings roadmaps/g01/README.md --require-heading '## Sequence' --require-heading '## Next roadmap' --require-heading '## Next Task'" },
]

"check:rollout" = [{ rhai = "scripts/rollout-checks.rhai" }]
