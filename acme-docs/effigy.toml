[catalog]
alias = "acme-docs"

[docs_policy.indexes.vision]
file = "vision/README.md"
dir = "vision"
section = "Vision Artifacts"

[docs_policy.next_actions.vision]
index = "vision"
heading = "## Next Task"
allowlist_file = "policy/vision-next-task-verbs.txt"

[tasks]
health = [
  { task = "check:admin-freshness-rollout" },
]

validate = [
  { task = "check:admin-freshness-rollout" },
  { task = "check:auth-security-alerting-rollout" },
  { task = "check:reorder-conflict-rollout" },
]

"qa:docs:links" = "effigy docs check-links --repo . README.md vision/README.md roadmaps/README.md logs/README.md"
"qa:docs:agent-defaults" = "effigy docs check-forbidden --repo . AGENTS.md README.md --forbid '--repo .'"
"qa:docs:headings" = "effigy docs check-headings --repo . README.md vision/README.md roadmaps/README.md logs/README.md --require-heading '## Next Task'"
"qa:docs:index:vision" = "effigy docs check-index --repo . --policy-index vision"
"qa:docs:next-action:vision" = "effigy docs check-next-action --repo . --policy vision"
"qa:northstar" = [
  { task = "qa:docs:headings" },
  { task = "qa:docs:index:vision" },
  { task = "qa:docs:next-action:vision" },
]
"qa:docs" = [
  { task = "qa:docs:links" },
  { task = "qa:docs:agent-defaults" },
  { task = "qa:northstar" },
]

qa = [
  { task = "validate" },
  { task = "qa:docs" },
]

"check:admin-freshness-rollout" = "bash ../scripts/check-admin-freshness-rollout.sh {args}"
"check:auth-security-alerting-rollout" = "bash ../scripts/check-auth-security-alerting-rollout.sh {args}"
"check:reorder-conflict-rollout" = "bash ../scripts/check-reorder-conflict-rollout.sh {args}"
