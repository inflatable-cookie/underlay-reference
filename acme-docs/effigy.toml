[catalog]
alias = "acme-docs"

[task_defaults]
run_in = "either"

[docs_policy.indexes.vision]
file = "acme-docs/vision/README.md"
dir = "acme-docs/vision"
section = "Vision Artifacts"

[docs_policy.next_actions.vision]
index = "vision"
heading = "## Next Task"
allowlist_file = "acme-docs/policy/vision-next-task-verbs.txt"

[tasks]
health = [
  { task = "check:admin-freshness-rollout" },
]

validate = [
  { task = "check:admin-freshness-rollout" },
  { task = "check:auth-security-alerting-rollout" },
  { task = "check:reorder-conflict-rollout" },
]

qa = [
  { task = "validate" },
  { task = "qa:docs" },
]

"qa:docs" = [
  { task = "qa:docs:links" },
  { task = "qa:docs:agent-defaults" },
  { task = "qa:docs:workspace-contract" },
  { task = "qa:northstar" },
]

"qa:docs:links" = [
  { task = "docs check-links acme-docs/README.md acme-docs/vision/README.md acme-docs/roadmaps/README.md acme-docs/logs/README.md" },
]
"qa:northstar" = [
  { task = "qa:northstar:vision" },
  { task = "qa:northstar:roadmaps" },
  { task = "qa:northstar:g01" },
]

"qa:docs:agent-defaults" = [
  { task = "docs check-forbidden AGENTS.md README.md --forbid '--repo .'" },
]
"qa:docs:workspace-contract" = [
  { task = "docs check-forbidden AGENTS.md README.md package.json --forbid '--repo .'" },
]
"qa:docs:headings" = [
  { task = "docs check-headings acme-docs/README.md acme-docs/vision/README.md acme-docs/roadmaps/README.md acme-docs/logs/README.md --require-heading '## Next Task'" },
]
"qa:northstar:vision" = [
  { task = "docs check-headings acme-docs/vision/README.md --require-heading '## Vision Artifacts' --require-heading '## Next Task'" },
]
"qa:northstar:roadmaps" = [
  { task = "docs check-headings acme-docs/roadmaps/README.md --require-heading '## Rules' --require-heading '## Current generation' --require-heading '## Next Task'" },
]
"qa:northstar:g01" = [
  { task = "docs check-headings acme-docs/roadmaps/g01/README.md --require-heading '## Sequence' --require-heading '## Next roadmap' --require-heading '## Next Task'" },
]

"check:admin-freshness-rollout" = [{ rhai = "scripts/rollout-checks.rhai" }]
"check:auth-security-alerting-rollout" = [{ rhai = "scripts/rollout-checks.rhai" }]
"check:reorder-conflict-rollout" = [{ rhai = "scripts/rollout-checks.rhai" }]
