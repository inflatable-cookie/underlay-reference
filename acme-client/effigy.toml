[manifest]
minimum_effigy_version = "0.7.0"

[catalog]
alias = "acme-client"

[package_manager]
js = "bun"

[tasks]
build = "bun x tsc -p tsconfig.json"
check = "bun x tsc -p tsconfig.json --noEmit"

qa = [{ task = "validate" }]
health = [{ task = "check" }]
validate = [
  { task = "check" },
  { task = "build" }
]
