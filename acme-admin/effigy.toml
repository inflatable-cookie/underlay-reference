[catalog]
alias = "acme-admin"

[package_manager]
js = "bun"

[tasks]
health = [{ task = "check" }]
validate = [
  { task = "check" },
  { task = "build" }
]
qa = [{ task = "validate" }]

[tasks.dev]
run = [
  { task = "clean" },
  { task = "sync" },
  "PUBLIC_API_URL=http://api.underlay-reference.test PUBLIC_ADMIN_URL=http://admin.underlay-reference.test PUBLIC_FRONT_URL=http://underlay-reference.test bun x vite dev --host 0.0.0.0 --port 41002 --strictPort --force"
]

[tasks.build]
run = "bun x vite build"

[tasks.preview]
run = "bun x vite preview"

[tasks.clean]
run = "rm -rf .svelte-kit node_modules/.vite"

[tasks.sync]
run = "bun x svelte-kit sync"

[tasks.prepare]
run = "bun x svelte-kit sync || echo ''"

[tasks.check]
run = [
  { task = "sync" },
  "bun x svelte-check --tsconfig ./tsconfig.json"
]

[tasks."check:watch"]
run = [
  { task = "sync" },
  "bun x svelte-check --tsconfig ./tsconfig.json --watch"
]
