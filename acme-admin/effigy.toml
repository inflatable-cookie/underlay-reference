[manifest]
minimum_effigy_version = "0.7.0"

[catalog]
alias = "acme-admin"

[package_manager]
js = "bun"

[tasks]
dev = [
  { task = "config:generate" },
  { task = "clean" },
  { task = "sync" },
  "bun x vite dev --host 0.0.0.0 --force"
]
build = [
  { task = "config:generate" },
  "bun x vite build"
]
preview = "bun x vite preview"

clean = "rm -rf .svelte-kit node_modules/.vite"
sync = "bun x svelte-kit sync"
"config:generate" = "bun scripts/generate-public-config.ts"
prepare = [
  { task = "config:generate" },
  "bun x svelte-kit sync || echo ''"
]

check = [
  { task = "config:generate" },
  { task = "sync" },
  "bun x svelte-check --tsconfig ./tsconfig.json"
]
"check:watch" = [
  { task = "sync" },
  "bun x svelte-check --tsconfig ./tsconfig.json --watch"
]

health = [{ task = "check" }]
validate = [
  { task = "check" },
  { task = "build" }
]
qa = [{ task = "validate" }]
