[package]
name = "acme-auth"
version.workspace = true
edition.workspace = true

[dependencies]
aes-gcm = "0.10"
async-trait = { workspace = true }
base64 = "0.22"
chrono = { workspace = true }
acme-core = { path = "../core" }
acme-db = { path = "../db" }
acme-infra = { path = "../infra" }
rand = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
thiserror = "2"
tokio = { workspace = true }
tracing = { workspace = true }
underlay-auth = { workspace = true }
underlay-auth-email-totp = { workspace = true }
underlay-auth-jwt = { workspace = true }
underlay-auth-oauth = { workspace = true }
underlay-auth-password = { workspace = true }
underlay-auth-state-postgres = { workspace = true }
underlay-auth-totp = { workspace = true }
underlay-auth-webauthn = { workspace = true, features = ["danger-allow-state-serialisation"] }
underlay-core = { workspace = true }
underlay-email = { workspace = true, features = ["templates"] }
underlay-ratelimit = { workspace = true }
underlay-security-alerts = { workspace = true }
uuid = { workspace = true }
webauthn-rs-proto = "0.5.4"
redis = { version = "1.2", features = ["tokio-comp", "connection-manager"] }
