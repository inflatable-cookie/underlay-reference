<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>{% block title %}{{ app_name }}{% endblock %}</title>
  <!--[if mso]>
  <noscript>
    <xml>
      <o:OfficeDocumentSettings>
        <o:PixelsPerInch>96</o:PixelsPerInch>
      </o:OfficeDocumentSettings>
    </xml>
  </noscript>
  <![endif]-->
  <style type="text/css">
    /* Reset styles */
    body, table, td, a { -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
    table, td { mso-table-lspace: 0pt; mso-table-rspace: 0pt; }
    img { -ms-interpolation-mode: bicubic; }

    /* Remove spacing around tables in Outlook */
    img { border: 0; height: auto; line-height: 100%; outline: none; text-decoration: none; }
    table { border-collapse: collapse !important; }
    body { height: 100% !important; margin: 0 !important; padding: 0 !important; width: 100% !important; }

    /* iOS blue links */
    a[x-apple-data-detectors] {
      color: inherit !important;
      text-decoration: none !important;
      font-size: inherit !important;
      font-family: inherit !important;
      font-weight: inherit !important;
      line-height: inherit !important;
    }

    /* Gmail blue links */
    u + #body a {
      color: inherit;
      text-decoration: none;
      font-size: inherit;
      font-family: inherit;
      font-weight: inherit;
      line-height: inherit;
    }

    /* Samsung Mail blue links */
    #MessageViewBody a {
      color: inherit;
      text-decoration: none;
      font-size: inherit;
      font-family: inherit;
      font-weight: inherit;
      line-height: inherit;
    }

    /* Responsive styles */
    @media screen and (max-width: 600px) {
      .responsive-table {
        width: 100% !important;
      }
      .responsive-padding {
        padding-left: 20px !important;
        padding-right: 20px !important;
      }
      .responsive-stack {
        display: block !important;
        width: 100% !important;
      }
    }
  </style>
</head>
<body id="body" style="margin: 0 !important; padding: 0 !important; background-color: #f4f5f7;">
  <!-- Preview text (hidden but shown in email client preview) -->
  <div style="display: none; font-size: 1px; color: #f4f5f7; line-height: 1px; max-height: 0px; max-width: 0px; opacity: 0; overflow: hidden;">
    {% block preview %}{% endblock %}
  </div>

  <!-- Email wrapper table -->
  <table border="0" cellpadding="0" cellspacing="0" width="100%" style="background-color: #f4f5f7;">
    <tr>
      <td align="center" style="padding: 40px 10px;">
        <!-- Email container -->
        <table border="0" cellpadding="0" cellspacing="0" width="600" class="responsive-table" style="background-color: #ffffff; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.05);">

          <!-- Header -->
          <tr>
            <td align="center" style="padding: 30px 40px 20px 40px; border-bottom: 1px solid #e8e8e8;" class="responsive-padding">
              {% block header %}
              <table border="0" cellpadding="0" cellspacing="0" width="100%">
                <tr>
                  <td align="center">
                    <span style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 24px; font-weight: 700; color: #1a1a1a;">{{ app_name }}</span>
                  </td>
                </tr>
              </table>
              {% endblock %}
            </td>
          </tr>

          <!-- Content -->
          <tr>
            <td style="padding: 40px;" class="responsive-padding">
              {% block content %}{% endblock %}
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td style="padding: 20px 40px 30px 40px; border-top: 1px solid #e8e8e8; background-color: #fafafa; border-radius: 0 0 8px 8px;" class="responsive-padding">
              {% block footer %}
              <table border="0" cellpadding="0" cellspacing="0" width="100%">
                <tr>
                  <td align="center" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 12px; color: #888888; line-height: 1.6;">
                    <p style="margin: 0 0 10px 0;">
                      This email was sent by <a href="{{ app_url }}" style="color: #4a90d9; text-decoration: none;">{{ app_name }}</a>
                    </p>
                    <p style="margin: 0;">
                      Need help? Contact us at <a href="mailto:{{ support_email }}" style="color: #4a90d9; text-decoration: none;">{{ support_email }}</a>
                    </p>
                    <p style="margin: 10px 0 0 0; color: #aaaaaa;">
                      &copy; {{ current_year }} {{ app_name }}. All rights reserved.
                    </p>
                  </td>
                </tr>
              </table>
              {% endblock %}
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
