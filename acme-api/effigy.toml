[manifest]
minimum_effigy_version = "0.7.0"

[catalog]
alias = "acme-api"

[task_defaults]
run_in = "host"

[tasks]
api = "cd {repo} && cargo run -p acme-api {args}"
jobs = "cd {repo} && cargo run -p acme-jobs {args}"
build = "cd {repo} && cargo build {args}"

"db:drop" = "cd {repo} && cargo run -p acme-db --bin reset_dev_db {args}"
"db:migrate" = "cd {repo} && cargo run -p acme-db --bin migrate_dev_db {args}"
"db:reset" = [
  { task = "db:drop" },
  { task = "db:migrate" }
]

test = "cd {repo} && cargo test --workspace {args}"
clippy = "cd {repo} && cargo clippy --workspace --all-targets -- -D warnings"
fmt = "cd {repo} && cargo fmt --all --check"

health = [{ task = "build" }]
validate = [
  { task = "build" },
  { task = "test" },
  { task = "clippy" },
  { task = "fmt" }
]
qa = [{ task = "validate" }]
