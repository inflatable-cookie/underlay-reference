[catalog]
alias = "acme-api"

[package_manager]
js = "bun"

[tasks]
build = "cargo build {args}"
health = [{ task = "build" }]
validate = [{ task = "build" }]
qa = [{ task = "validate" }]
dev = "HOST=0.0.0.0 PORT=41001 PUBLIC_HOST=api.acme.test EMAIL_APP_URL=https://admin.acme.test DATABASE_URL=postgres://postgres:postgres@postgres:5432/acme EMAIL_ADAPTER=smtp SMTP_HOST=mailpit SMTP_PORT=1025 SMTP_TLS=none CORS_ORIGINS=https://acme.test,https://admin.acme.test COOKIE_DOMAIN=.acme.test COOKIE_SECURE=true WEBAUTHN_RP_ID=admin.acme.test WEBAUTHN_RP_ORIGIN=https://admin.acme.test cargo run -p acme-api {args}"
"dev:watch" = "cargo watch -x 'run -p acme-api'"
jobs = "DATABASE_URL=postgres://postgres:postgres@postgres:5432/acme cargo run -p acme-jobs {args}"
"db:drop" = "cargo run -p acme-db --bin reset_dev_db {args}"
"db:migrate" = "cargo run -p acme-db --bin migrate_dev_db {args}"
"db:reset" = [
  { task = "db:drop" },
  { task = "db:migrate" }
]
