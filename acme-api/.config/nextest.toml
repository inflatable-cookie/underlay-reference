[profile.default]
# Keep output readable locally.
status-level = "pass"

# Treat long-running tests as slow and terminate if they hang.
slow-timeout = { period = "60s", terminate-after = 2, grace-period = "10s" }

[profile.ci]
# CI should be deterministic and reasonably strict.
status-level = "fail"
slow-timeout = { period = "45s", terminate-after = 2, grace-period = "10s" }
