[email]
default_from = "noreply@acme.example.com"
app_name = "Acme"
app_url = "https://acme.example.com"
support_email = "support@acme.example.com"
templates_dir = "templates/emails"

[auth]
jwt_access_token_lifetime_minutes = 15
jwt_refresh_token_lifetime_days = 30
jwt_issuer = "acme"
