# Docker Compose for Underlay Reference Development
#
# Provides local development services for the Acme reference implementation.
#
# Usage:
#   docker compose up -d          # Start all services
#   docker compose up -d postgres # Start just PostgreSQL
#   docker compose logs -f        # View logs
#   docker compose down           # Stop all services
#   docker compose down -v        # Stop and remove volumes (fresh start)
#
# Services:
#   - postgres: PostgreSQL 16 database on port 5432
#   - minio: S3-compatible blob storage on port 9000 (console on 9001)
#   - mailhog: Email testing on port 8025 (SMTP on 1025)

services:
  # ==========================================================================
  # PostgreSQL Database
  # ==========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: acme-postgres
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: acme
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d acme"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ==========================================================================
  # MinIO (S3-compatible blob storage)
  # ==========================================================================
  # Access the console at http://localhost:9001
  # Default credentials: minioadmin / minioadmin
  #
  # For local development, configure:
  #   BLOB_ADAPTER=s3
  #   S3_ENDPOINT=http://localhost:9000
  #   S3_BUCKET=acme-media
  #   S3_ACCESS_KEY=minioadmin
  #   S3_SECRET_KEY=minioadmin
  #   S3_REGION=us-east-1
  minio:
    image: minio/minio:latest
    container_name: acme-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Create default bucket on startup
  minio-init:
    image: minio/mc:latest
    container_name: acme-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set minio http://minio:9000 minioadmin minioadmin;
      mc mb minio/acme-media --ignore-existing;
      mc anonymous set download minio/acme-media;
      echo 'Bucket acme-media created and configured';
      "
    restart: "no"

  # ==========================================================================
  # MailHog (Email testing)
  # ==========================================================================
  # View captured emails at http://localhost:8025
  # SMTP server available at localhost:1025
  #
  # For local development, configure:
  #   EMAIL_ADAPTER=smtp
  #   SMTP_HOST=localhost
  #   SMTP_PORT=1025
  #   SMTP_FROM=noreply@acme.local
  mailhog:
    image: mailhog/mailhog:latest
    container_name: acme-mailhog
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local
