[public_api]
base_url = "https://api.acme.test"
api_version = "2025-01-01"
front_url = "https://acme.test"
admin_url = "https://admin.acme.test"

# Declared API-version vocabulary. `default_version` must stay in step with
# `[public_api] api_version` above: that is the value the TypeScript client
# sends on every request, and the server rejects anything outside
# `supported_versions`. Runtime endpoints are exempt from the header entirely.
[acme_api.api]
supported_versions = ["2025-01-01"]
default_version = "2025-01-01"

[acme_api.database]

[acme_api.runtime]
host = "127.0.0.1"
port = 3000
public_host = "localhost"

[acme_api.cors]
allowed_origins = []
# Cookie name prefix, e.g. "acme_" for "acme_refresh_token". Empty means none.
cookie_prefix = ""
# SameSite=Strict for auth cookies. Lax only where a local cross-port dev flow
# genuinely needs it.
cookie_same_site_strict = true
refresh_token_max_age_secs = 2592000

[acme_api.email]
default_from = "noreply@acme.example.com"
app_name = "Acme"
app_url = "https://acme.example.com"
support_email = "support@acme.example.com"
templates_dir = "templates/emails"

[acme_api.auth]
jwt_access_token_lifetime_minutes = 15
jwt_refresh_token_lifetime_days = 30
jwt_issuer = "acme"
jwt_audience = "acme-api"
jwt_leeway_seconds = 30
totp_issuer = "Acme"
password_min_length = 12
login_rate_limit_per_hour = 10
register_rate_limit_per_hour = 5
password_change_rate_limit_per_hour = 5
passkey_register_rate_limit_per_hour = 5
passkey_login_rate_limit_per_hour = 10
refresh_rate_limit_per_hour = 60
max_totp_attempts = 5
max_email_code_attempts = 5
max_backup_code_attempts = 5
totp_state_timeout_secs = 300
email_state_timeout_secs = 600
verification_session_timeout_secs = 300
rate_limit_cleanup_interval_secs = 300
absolute_session_timeout_days = 30
rate_limit_retry_after_short_secs = 60
rate_limit_retry_after_long_secs = 300
max_failed_logins = 5
lockout_duration_secs = 900
security_alert_window_secs = 600
security_alert_cooldown_secs = 1800
security_alert_failed_attempts_threshold = 20
security_alert_distinct_users_threshold = 5
security_alert_lockouts_threshold = 3
email_code_expiry_secs = 600
max_email_codes_per_hour = 5
webauthn_rp_id = "localhost"
webauthn_rp_origin = "http://localhost:4174"
webauthn_rp_name = "Acme"
argon2_memory_kb = 131072
argon2_iterations = 4
argon2_parallelism = 4
