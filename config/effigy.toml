# Shared config overlay for the effigy container dev stack.
#
# Loaded when ENVIRONMENT=effigy (injected fleet-wide by the effigy bundle's
# env schema): default.toml -> effigy.toml -> local.toml (personal overrides).
# Non-secret dev constants only — these are identical for every operator
# because the container dev environment is uniform. Secrets live in the
# effigy vault.

[acme_api.runtime]
host = "0.0.0.0"
port = 41001
public_host = "api.acme.test"

[acme_api.database]
url = "postgres://postgres:secret@postgres.acme.test:5432/acme"

[acme_api.cors]
allowed_origins = ["https://acme.test", "https://admin.acme.test"]
cookie_domain = ".acme.test"
cookie_secure = true

[acme_api.email]
app_url = "https://admin.acme.test"

[acme_api.auth]
webauthn_rp_id = "admin.acme.test"
webauthn_rp_origin = "https://admin.acme.test"
webauthn_rp_name = "Acme"
