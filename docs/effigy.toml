[manifest]
minimum_effigy_version = "0.7.0"

[catalog]
alias = "acme-docs"

[tasks]
health = [
  { task = "check:rollout admin-freshness" },
]

validate = [
  { task = "check:rollout admin-freshness" },
  { task = "check:rollout auth-security-alerting" },
  { task = "check:rollout reorder-conflict" },
]

qa = [
  { task = "validate" },
  { task = "qa:docs" },
]

# Effigy resolves `docs check` file arguments from the repository root, not
# this catalog's directory, so the paths here are root-relative.
"qa:docs" = [
  { task = "docs check links docs/README.md docs/knowledge/README.md" },
  { task = "docs check forbidden docs/AGENTS.md docs/README.md AGENTS.md package.json --forbid '--repo .'" },
  { task = "qa:northstar" },
]

"qa:northstar" = [
  { task = "docs check contains AGENTS.md --require 'Effigy Agent Skill' --require 'effigy acme-docs/qa:docs' --require 'docs/README.md' --require 'docs/knowledge/README.md'" },
  { task = "docs check contains docs/README.md --require 'knowledge/README.md'" },
]

"check:rollout" = [{ rhai = "scripts/rollout-checks.rhai" }]
