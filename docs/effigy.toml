[manifest]
minimum_effigy_version = "0.7.0"

[catalog]
alias = "acme-docs"

[tasks]
health = [
  { task = "check:rollout admin-freshness" },
]

validate = [
  { task = "check:rollout admin-freshness" },
  { task = "check:rollout auth-security-alerting" },
  { task = "check:rollout reorder-conflict" },
]

qa = [
  { task = "validate" },
  { task = "qa:docs" },
]

"qa:docs" = [
  { task = "docs check links README.md knowledge/README.md plan.md" },
  { task = "docs check forbidden AGENTS.md README.md --forbid '--repo .'" },
  { task = "docs check forbidden AGENTS.md README.md ../package.json --forbid '--repo .'" },
  { task = "qa:northstar" },
]

"qa:northstar" = [
  { task = "docs check contains ../AGENTS.md --require 'effigy tasks' --require 'effigy test --plan' --require 'docs/README.md' --require 'docs/knowledge/README.md' --require 'docs/plan.md'" },
  { task = "docs check contains README.md --require 'knowledge/README.md' --require 'plan.md'" },
]

"check:rollout" = [{ rhai = "scripts/rollout-checks.rhai" }]
