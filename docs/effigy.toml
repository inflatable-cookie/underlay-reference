[manifest]
minimum_effigy_version = "0.7.0"

[catalog]
alias = "acme-docs"

[tasks]
health = [
  { task = "check:rollout admin-freshness" },
]

validate = [
  { task = "check:rollout admin-freshness" },
  { task = "check:rollout auth-security-alerting" },
  { task = "check:rollout reorder-conflict" },
]

qa = [
  { task = "validate" },
  { task = "qa:docs" },
]

# `docs check` resolves explicit paths from the invoking task's cwd, which is
# this catalog's directory (Effigy guide 085, v0.15 migration). Spell catalog
# files cwd-relative and repository files `../`-relative.
"qa:docs" = [
  { task = "docs check links README.md knowledge/README.md" },
  { task = "docs check forbidden AGENTS.md README.md ../AGENTS.md ../package.json --forbid '--repo .'" },
  { task = "qa:northstar" },
]

"qa:northstar" = [
  { task = "docs check contains ../AGENTS.md --require 'Effigy Agent Skill' --require 'effigy acme-docs/qa:docs' --require 'docs/README.md' --require 'docs/knowledge/README.md'" },
  { task = "docs check contains README.md --require 'knowledge/README.md'" },
]

"check:rollout" = [{ rhai = "scripts/rollout-checks.rhai" }]
