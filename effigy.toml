[catalog]
alias = "underlay-reference"

[bundle]
base = "underlay"
host = "acme.test"
project_name = "underlay-reference-dev"
workspace_subdir = "underlay-reference"
database = "acme"

[bootstrap]
run = [
  { task = "container up --detach" },
  { task = "deps sync ../underlay acme-api acme-client acme-ui acme-front acme-admin" },
]
start = "dev"

[[bootstrap.children]]
path = "../underlay"
repo = "git@github.com:inflatable-cookie/underlay.git"
branch = "main"

[[bootstrap.children]]
path = "../poodle"
repo = "git@github.com:inflatable-cookie/poodle.git"
branch = "main"

[systems.dev]
mounts = ["../underlay", "../poodle"]

[task_defaults]
run_in = "host"

[tasks.health]
run = [
  { task = "acme-docs/health" },
  { task = "acme-api/health" },
  { task = "acme-client/health" },
  { task = "acme-admin/health" },
  { task = "acme-front/health" },
  { task = "acme-ui/health" },
]

[tasks.validate]
run = [
  { task = "acme-docs/validate" },
  { task = "acme-api/validate" },
  { task = "acme-client/validate" },
  { task = "acme-admin/validate" },
  { task = "acme-front/validate" },
  { task = "acme-ui/validate" },
]

[tasks.qa]
run = [
  { task = "health" },
  { task = "validate" },
  { task = "qa:docs" },
  { task = "qa:northstar" },
]

[tasks.dev]
mode = "tui"
container_lifecycle = true
gateway = true
health_wait = true
concurrent = [
  { role = "lifecycle", start = 1, tab = 6 },
  { role = "shell", service = "workspace", start = 2, tab = 5 },
  { task = "acme-api/dev", start = 3, tab = 4 },
  { task = "acme-api/jobs", start = 4, tab = 3, start_after_ms = 1500 },
  { name = "front", task = "acme-front/dev", setup = [{ rhai = "{{ bundle.root }}/scripts/dev/ui-setup.rhai" }], start = 5, tab = 2 },
  { name = "admin", task = "acme-admin/dev", setup = [{ rhai = "{{ bundle.root }}/scripts/dev/ui-setup.rhai" }], start = 6, tab = 1 }
]
