[catalog]
alias = "underlay-reference"

[bundle]
base = "underlay"
host = "acme.test"
project_name = "underlay-reference-dev"
workspace_subdir = "underlay-reference"
database = "acme"

[bootstrap]
setup = ["bootstrap:deps"]
start = "dev"

[systems.dev]
mounts = ["../underlay", "../poodle"]

[tasks.health]
host = true
run = [
  { task = "acme-docs/health" },
  { task = "acme-api/health" },
  { task = "acme-client/health" },
  { task = "acme-admin/health" },
  { task = "acme-front/health" },
  { task = "acme-ui/health" },
]

[tasks.validate]
host = true
run = [
  { task = "acme-docs/validate" },
  { task = "acme-api/validate" },
  { task = "acme-client/validate" },
  { task = "acme-admin/validate" },
  { task = "acme-front/validate" },
  { task = "acme-ui/validate" },
]

[tasks."qa:docs"]
host = true
run = [
  { task = "qa:docs:workspace-contract" },
  { task = "acme-docs/qa:docs" },
]

[tasks."qa:northstar"]
host = true
run = [
  { task = "acme-docs/qa:northstar" },
]

[tasks.qa]
host = true
run = [
  { task = "health" },
  { task = "validate" },
  { task = "qa:docs" },
  { task = "qa:northstar" },
]

[tasks."bootstrap:deps"]
run = "test -d ../underlay && test -d ../poodle && effigy container up --detach && effigy exec sh -lc 'cd /workspace-root/underlay && bun install && cargo fetch && cd /workspace-root/underlay-reference/acme-api && cargo fetch && cd /workspace-root/underlay-reference/acme-client && bun install && cd /workspace-root/underlay-reference/acme-ui && bun install && cd /workspace-root/underlay-reference/acme-front && bun install && cd /workspace-root/underlay-reference/acme-admin && bun install'"
host = true

[tasks."proof:pwd"]
run = "pwd"
host = true

[tasks."qa:docs:workspace-contract"]
run = "effigy docs check-forbidden AGENTS.md README.md package.json --forbid '--repo .'"
host = true

[tasks.dev]
mode = "tui"
container_lifecycle = true
gateway = true
health_wait = true
concurrent = [
  { role = "lifecycle", start = 1, tab = 6 },
  { role = "shell", service = "workspace", start = 2, tab = 5 },
  { task = "acme-api/dev", start = 3, tab = 4 },
  { task = "acme-api/jobs", start = 4, tab = 3, start_after_ms = 1500 },
  { name = "front", task = "acme-front/dev", setup = [{ rhai = "{{ bundle.root }}/scripts/dev/ui-setup.rhai" }], start = 5, tab = 2 },
  { name = "admin", task = "acme-admin/dev", setup = [{ rhai = "{{ bundle.root }}/scripts/dev/ui-setup.rhai" }], start = 6, tab = 1 }
]
