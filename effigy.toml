[catalog]
alias = "underlay-reference"

[package_manager]
js = "bun"

[tasks]
health = [
  { task = "acme-docs/health" },
  { task = "acme-api/health" },
  { task = "acme-client/health" },
  { task = "acme-admin/health" },
  { task = "acme-front/health" },
  { task = "acme-ui/health" },
]

validate = [
  { task = "acme-docs/validate" },
  { task = "acme-api/validate" },
  { task = "acme-client/validate" },
  { task = "acme-admin/validate" },
  { task = "acme-front/validate" },
  { task = "acme-ui/validate" },
]

"qa:docs:workspace-contract" = "effigy docs check-forbidden AGENTS.md README.md package.json --forbid '--repo .'"

"qa:docs" = [
  { task = "qa:docs:workspace-contract" },
  { task = "acme-docs/qa:docs" },
]

"qa:northstar" = [
  { task = "acme-docs/qa:northstar" },
]

qa = [
  { task = "health" },
  { task = "validate" },
  { task = "qa:docs" },
  { task = "qa:northstar" },
]

[tasks.dev]
mode = "tui"
concurrent = [
  { task = "acme-api/dev", start = 1, tab = 3 },
  { task = "acme-api/jobs", start = 2, tab = 4, start_after_ms = 1500 },
  { task = "acme-front/dev", start = 3, tab = 2 },
  { task = "acme-admin/dev", start = 4, tab = 1 },
  { task = "shell", start = 5, tab = 5 }
]

[tasks.dev.profiles.front]
concurrent = [
  { task = "acme-api/dev", start = 1, tab = 2 },
  { task = "acme-api/jobs", start = 2, tab = 3, start_after_ms = 1500 },
  { task = "acme-front/dev", start = 3, tab = 1 },
  { task = "shell", start = 4, tab = 4 }
]

[tasks.dev.profiles.admin]
concurrent = [
  { task = "acme-api/dev", start = 1, tab = 3 },
  { task = "acme-api/jobs", start = 2, tab = 2, start_after_ms = 1500 },
  { task = "acme-admin/dev", start = 3, tab = 1 },
  { task = "shell", start = 4, tab = 4 }
]
