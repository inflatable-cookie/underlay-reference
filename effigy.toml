[manifest]
minimum_effigy_version = "0.10.0"

[catalog]
alias = "underlay-reference"

[bundle]
base = { type = "git", url = "git@github.com:inflatable-cookie/underlay-effigy-bundle.git" }
host = "acme.test"
project_name = "underlay-reference-dev"
workspace_subdir = "underlay-reference"
databases = ["acme"]

[bundle.dirs]
docs = "acme-docs"
api = "acme-api"
client = "acme-client"
ui = "acme-ui"
front = "acme-front"
admin = "acme-admin"

[systems.dev]
mounts = [{ member = "underlay" }, { member = "poodle" }]

[tasks."qa:security"]
run = "../underlay/scripts/check-consumer-conformance.sh ."
run_in = "host"
