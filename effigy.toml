[manifest]
minimum_effigy_version = "0.11.0"

[catalog]
alias = "underlay-reference"

[bundle]
base = { type = "git", url = "git@github.com:inflatable-cookie/underlay-effigy-bundle.git" }
host = "acme.test"
project_name = "underlay-reference-dev"
workspace_subdir = "underlay-reference"
databases = ["acme"]

# Physical ownership paths for the monorepo workspace shape (Underlay contract
# 024). These feed catalog members, container isolated dirs, deploy source
# roots, and bootstrap dependency sync.
[bundle.dirs]
docs = "docs"
api = "apps/acme-api"
client = "packages/acme-client"
ui = "packages/acme-ui"
front = "apps/acme-front"
admin = "apps/acme-admin"

[bundle.catalogs]
docs = "acme-docs"
api = "acme-api"
client = "acme-client"
ui = "acme-ui"
front = "acme-front"
admin = "acme-admin"

[bundle.workspace]
js_root = true

[systems.dev]
mounts = [{ member = "underlay" }, { member = "poodle" }]

[test]
exclude_catalogs = ["poodle", "underlay"]

[tasks."qa:security"]
run = "../underlay/scripts/check-consumer-conformance.sh ."
run_in = "host"

[tasks."qa:templates"]
run = "../underlay/scripts/check-template-conformance.sh apps/acme-admin"
run_in = "host"

[tasks."qa:workspace-shape"]
run = "bun ../underlay/ts/bin/underlay-workspace-shape.ts ."
run_in = "host"

[state]
default = "local"

[state.local]
schema = "effigy.state-stack.v1"
name = "underlay-reference-local"
environment = "dev"

[[state.local.layers]]
key = "reset"
role = "structure"
source = "acme-api/migration:reset:schema"
apply_mode = "task"
environment_policy = "all"

[[state.local.layers]]
key = "structure"
role = "structure"
source = "acme-api/migration:apply"
apply_mode = "task"
environment_policy = "all"
depends_on = ["reset"]

[[state.local.layers]]
key = "dev-overlay"
role = "dev-overlay"
source = "acme-api/migration:apply:overlay"
apply_mode = "task"
environment_policy = "dev-only"
depends_on = ["structure"]
