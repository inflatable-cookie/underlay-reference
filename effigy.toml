[manifest]
minimum_effigy_version = "0.11.0"

[catalog]
alias = "underlay-reference"

[bundle]
base = { type = "git", url = "git@github.com:inflatable-cookie/underlay-effigy-bundle.git" }
host = "acme.test"
project_name = "underlay-reference-dev"
workspace_subdir = "underlay-reference"
databases = ["acme"]

# Physical ownership paths for the monorepo workspace shape (Underlay contract
# 024). These feed catalog members, container isolated dirs, deploy source
# roots, and bootstrap dependency sync.
[bundle.dirs]
docs = "docs"
api = "apps/acme-api"
client = "packages/acme-client"
ui = "packages/acme-ui"
front = "apps/acme-front"
admin = "apps/acme-admin"

[bundle.catalogs]
docs = "acme-docs"
api = "acme-api"
client = "acme-client"
ui = "acme-ui"
front = "acme-front"
admin = "acme-admin"

[bundle.workspace]
js_root = true

[systems.dev]
mounts = [{ member = "underlay" }, { member = "poodle" }]

[test]
exclude_catalogs = ["poodle", "underlay"]

[tasks."qa:security"]
run = "../underlay/scripts/check-consumer-conformance.sh ."
run_in = "host"

[tasks."qa:templates"]
run = "../underlay/scripts/check-template-conformance.sh apps/acme-admin"
run_in = "host"

# Released-package conformance. These run the binaries published by the
# @inflatable-cookie/underlay dependency, not sibling Underlay source, so the
# proof holds without an ../underlay checkout. Requires one prior
# `effigy workspace:js:prepare`.
[tasks."qa:workspace-shape"]
run = "./node_modules/.bin/underlay-workspace-shape ."
run_in = "host"

[tasks."qa:env-authority"]
run = "./node_modules/.bin/underlay-env-authority ."
run_in = "host"

[tasks."qa:conformance"]
run = [
  { task = "qa:workspace-shape" },
  { task = "qa:env-authority" },
]

# Repo-owned secret authority. The Effigy bundle declares the shared consumer
# key set; these entries make this app's settled startup requirements
# executable rather than only documented. They mirror
# config/required-secrets.txt, which stays the human-readable authority.
#
# Values live in the local Effigy vault, never in a committed file. The
# bundle's generate hook fills the generatable dev keys on first
# secrets-required task startup, so `effigy dev` still works from a clean
# clone.

[secrets.keys.auth_jwt_private_key]
required = true
targets = ["tasks", "containers", "rhai"]
description = "Ed25519 JWT signing key. Unconditional startup authority: the API refuses to start without it in every environment."

[secrets.keys.auth_jwt_public_key]
required = true
targets = ["tasks", "containers", "rhai"]
description = "Ed25519 JWT verification key. Not confidential, but unconditional startup authority: the API refuses to start without it in every environment."

[secrets.keys.encryption_key]
required = false
targets = ["tasks", "containers", "rhai"]
description = "Encrypts stored TOTP secrets. Required in deployed environments; may be absent with an explicit warning in local, effigy, and test, which is why this is not marked required."

[secrets.keys.database_url]
required = false
targets = ["tasks", "containers"]
description = "Application database URL. Local exception: local and effigy resolve it from the committed non-secret config/effigy.toml overlay, so no vault value is needed for the dev loop. Deployed environments must inject it as a real secret."

[state]
default = "local"

[state.local]
schema = "effigy.state-stack.v1"
name = "underlay-reference-local"
environment = "dev"

[[state.local.layers]]
key = "reset"
role = "structure"
source = "acme-api/migration:reset:schema"
apply_mode = "task"
environment_policy = "all"

[[state.local.layers]]
key = "structure"
role = "structure"
source = "acme-api/migration:apply"
apply_mode = "task"
environment_policy = "all"
depends_on = ["reset"]

[[state.local.layers]]
key = "dev-overlay"
role = "dev-overlay"
source = "acme-api/migration:apply:overlay"
apply_mode = "task"
environment_policy = "dev-only"
depends_on = ["structure"]
