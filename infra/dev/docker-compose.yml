services:
  workspace:
    build:
      context: ../..
      dockerfile: infra/dev/workspace.Dockerfile
    working_dir: /workspace-root/underlay-reference
    command:
    - sleep
    - infinity
    ports:
    - 41001:41001
    - 41002:41002
    - 41003:41003
    extra_hosts:
    - underlay-reference.test:host-gateway
    - admin.underlay-reference.test:host-gateway
    - api.underlay-reference.test:host-gateway
    - mailpit.underlay-reference.test:host-gateway
    - minio-console.underlay-reference.test:host-gateway
    volumes:
    - ../../../:/workspace-root
    - underlay-reference-dev-cargo-registry:/usr/local/cargo/registry
    - underlay-reference-dev-cargo-git:/usr/local/cargo/git
    - underlay-reference-dev-api-target:/workspace-root/underlay-reference/acme-api/target
    - underlay-reference-dev-client-node-modules:/workspace-root/underlay-reference/acme-client/node_modules
    - underlay-reference-dev-ui-node-modules:/workspace-root/underlay-reference/acme-ui/node_modules
    - underlay-reference-dev-front-node-modules:/workspace-root/underlay-reference/acme-front/node_modules
    - underlay-reference-dev-admin-node-modules:/workspace-root/underlay-reference/acme-admin/node_modules
    healthcheck:
      test:
      - CMD-SHELL
      - command -v cargo >/dev/null && command -v bun >/dev/null
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
  mailpit:
    image: axllent/mailpit:latest
    ports:
    - 1025:1025
    - 8025:8025
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: '1'
      MP_SMTP_AUTH_ALLOW_INSECURE: '1'
    healthcheck:
      test:
      - CMD
      - wget
      - --spider
      - -q
      - http://127.0.0.1:8025/
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s
  minio:
    image: minio/minio:latest
    command:
    - server
    - /data
    - --console-address
    - :9001
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
    - 9000:9000
    - 9001:9001
    volumes:
    - underlay-reference-dev-minio-data:/data
    healthcheck:
      test:
      - CMD
      - mc
      - ready
      - local
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: acme
      POSTGRES_PASSWORD: postgres
    ports:
    - 5432:5432
    volumes:
    - underlay-reference-dev-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U postgres
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
    command:
    - postgres
    - -c
    - shared_buffers=256MB
    - -c
    - max_connections=100
volumes:
  underlay-reference-dev-admin-node-modules:
    driver: local
  underlay-reference-dev-api-target:
    driver: local
  underlay-reference-dev-cargo-git:
    driver: local
  underlay-reference-dev-cargo-registry:
    driver: local
  underlay-reference-dev-client-node-modules:
    driver: local
  underlay-reference-dev-front-node-modules:
    driver: local
  underlay-reference-dev-minio-data:
    driver: local
  underlay-reference-dev-postgres-data:
    driver: local
  underlay-reference-dev-ui-node-modules:
    driver: local
